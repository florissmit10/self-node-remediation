apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-node-remediation-controller-manager
  namespace: self-node-remediation
spec:
  template:
    spec:
      containers:
      - name: manager
        volumeMounts:
        - mountPath: /tmp/k8s-webhook-server/serving-certs
          name: cert
          readOnly: true
      volumes:
      - name: cert
        secret:
          defaultMode: 420
          secretName: webhook-server-cert
