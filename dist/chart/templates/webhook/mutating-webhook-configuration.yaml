{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    {{- if .Values.certManager.enabled }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "self-node-remediation.resourceName" (dict "suffix" "serving-cert" "context" $) }}
    {{- end }}
  labels:
    self-node-remediation-operator: ""
  name: {{ include "self-node-remediation.resourceName" (dict "suffix" "mutating-webhook-configuration" "context" $) }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "self-node-remediation.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /mutate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediationtemplate
  failurePolicy: Fail
  name: mselfnoderemediationtemplate.kb.io
  rules:
  - apiGroups:
    - self-node-remediation.medik8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - selfnoderemediationtemplates
  sideEffects: None
{{- end }}
