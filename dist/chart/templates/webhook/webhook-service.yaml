{{- if .Values.webhook.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    self-node-remediation-operator: ""
  name: {{ include "self-node-remediation.resourceName" (dict "suffix" "webhook-service" "context" $) }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
  - port: 443
    targetPort: {{ .Values.webhook.port }}
  selector:
    control-plane: controller-manager
    self-node-remediation-operator: ""
{{- end }}
