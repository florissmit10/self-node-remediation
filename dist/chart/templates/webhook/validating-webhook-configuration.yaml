{{- if .Values.webhook.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  annotations:
    {{- if .Values.certManager.enabled }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "self-node-remediation.resourceName" (dict "suffix" "serving-cert" "context" $) }}
    {{- end }}
  labels:
    self-node-remediation-operator: ""
  name: {{ include "self-node-remediation.resourceName" (dict "suffix" "validating-webhook-configuration" "context" $) }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "self-node-remediation.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /validate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediation
  failurePolicy: Ignore
  name: vselfnoderemediation.kb.io
  rules:
  - apiGroups:
    - self-node-remediation.medik8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - selfnoderemediations
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "self-node-remediation.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /validate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediationconfig
  failurePolicy: Fail
  name: vselfnoderemediationconfig.kb.io
  rules:
  - apiGroups:
    - self-node-remediation.medik8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    - DELETE
    resources:
    - selfnoderemediationconfigs
  sideEffects: None
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "self-node-remediation.resourceName" (dict "suffix" "webhook-service" "context" $) }}
      namespace: {{ .Release.Namespace }}
      path: /validate-self-node-remediation-medik8s-io-v1alpha1-selfnoderemediationtemplate
  failurePolicy: Fail
  name: vselfnoderemediationtemplate.kb.io
  rules:
  - apiGroups:
    - self-node-remediation.medik8s.io
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - selfnoderemediationtemplates
  sideEffects: None
{{- end }}
